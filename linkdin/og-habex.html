<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card — habex.santhu.site</title>
<style>
  /* 1200 x 630. Same skeleton as og-santhu.html so the two read as a set in
     the Featured carousel; emerald accent instead of blue so they don't look
     like duplicates at thumbnail size. */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #07090c;
    font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 1200px; height: 630px;
    background:
      radial-gradient(760px 520px at 76% 22%, rgba(16,185,129,0.26) 0%, rgba(16,185,129,0) 64%),
      radial-gradient(620px 420px at 6% 96%, rgba(16,185,129,0.10) 0%, rgba(16,185,129,0) 62%),
      linear-gradient(140deg, #07090c 0%, #0a0f12 55%, #0c1619 100%);
    overflow: hidden;
  }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right,  rgba(255,255,255,0.038) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.038) 1px, transparent 1px);
    background-size: 52px 52px;
    mask-image: linear-gradient(120deg, transparent 0%, #000 42%, #000 100%);
    -webkit-mask-image: linear-gradient(120deg, transparent 0%, #000 42%, #000 100%);
  }

  .left { position: absolute; left: 74px; top: 112px; width: 620px; }

  .eyebrow {
    font-family: "Cascadia Code", "Consolas", "Courier New", monospace;
    font-size: 21px; font-weight: 600; letter-spacing: 2.2px;
    color: #34d399; margin-bottom: 26px;
  }

  h1 {
    font-size: 132px; line-height: 0.94;
    font-weight: 800; letter-spacing: -4.5px; color: #ffffff;
  }
  h1 .dot { color: #10b981; }

  .tagline {
    margin-top: 26px;
    font-size: 35px; line-height: 1.32; font-weight: 500;
    color: #98a6a2; letter-spacing: -0.4px;
  }

  .stack {
    position: absolute; left: 74px; bottom: 112px;
    font-size: 24px; font-weight: 600; color: #c3d3ce; letter-spacing: 0.4px;
  }
  .stack .sep { color: #3f5751; padding: 0 12px; }

  .url {
    position: absolute; left: 74px; bottom: 56px;
    font-family: "Cascadia Code", "Consolas", "Courier New", monospace;
    font-size: 27px; font-weight: 700; color: #34d399; letter-spacing: 0.5px;
  }

  /* stat panel — the proof, legible even at thumbnail size */
  .panel {
    position: absolute;
    right: 60px; top: 158px;
    width: 420px;
    background: #0d1417;
    border: 1px solid #1b2a28;
    border-radius: 14px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.55);
    overflow: hidden;
  }
  .panel .head {
    padding: 14px 22px;
    border-bottom: 1px solid #1b2a28;
    background: #0a1113;
    font-family: "Cascadia Code", "Consolas", monospace;
    font-size: 15px; color: #6b8480; letter-spacing: 1.2px;
  }
  .row {
    display: flex; align-items: baseline; gap: 16px;
    padding: 19px 22px;
    border-bottom: 1px solid #16211f;
  }
  .row:last-child { border-bottom: 0; }
  .row .n {
    font-size: 40px; font-weight: 800; color: #34d399;
    letter-spacing: -1.4px; min-width: 76px;
  }
  .row .n.sm { font-size: 27px; letter-spacing: -0.5px; }
  .row .l { font-size: 20px; color: #9fb2ad; font-weight: 500; line-height: 1.25; }
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>

  <div class="left">
    <div class="eyebrow">&gt; LIVE PRODUCT</div>
    <h1>Habex<span class="dot">.</span></h1>
    <div class="tagline">Expense, habit &amp; investment<br>tracking. Running in production.</div>
  </div>

  <div class="panel">
    <div class="head">UNDER THE HOOD</div>
    <div class="row"><div class="n">12</div><div class="l">versioned SQL migrations</div></div>
    <div class="row"><div class="n">3</div><div class="l">Supabase edge functions</div></div>
    <div class="row"><div class="n sm">RLS</div><div class="l">auth in Postgres, not the client</div></div>
  </div>

  <div class="stack">
    React<span class="sep">&middot;</span>TypeScript<span class="sep">&middot;</span>Supabase<span class="sep">&middot;</span>Postgres
  </div>
  <div class="url">habex.santhu.site</div>
</div>
</body>
</html>

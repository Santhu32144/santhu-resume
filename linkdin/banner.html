<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkedIn Banner — Santhosh R</title>
<style>
  /* LinkedIn banner is 1584 x 396.
     MEASURED from a real profile screenshot: the avatar is far bigger than it
     looks in mockups — it covers roughly x:60-380, y:210-396 in banner
     coordinates, and LinkedIn also crops a little off the bottom.
     So: nothing important below y=200 on the left. The headline block sits in
     the top-left, the links run along the top-right, and the stack chips stay
     right of x=640. */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1584px; height: 396px;
    overflow: hidden;
    background: #0d1b26;
    font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .banner {
    position: relative;
    width: 1584px; height: 396px;
    background:
      radial-gradient(1100px 500px at 78% 18%, rgba(52,104,143,0.55) 0%, rgba(52,104,143,0) 62%),
      radial-gradient(700px 400px at 12% 92%, rgba(181,101,29,0.20) 0%, rgba(181,101,29,0) 60%),
      linear-gradient(118deg, #0a1620 0%, #10242f 48%, #16323f 100%);
    overflow: hidden;
  }

  /* faint engineering grid */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right,  rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: linear-gradient(105deg, transparent 0%, #000 38%, #000 100%);
    -webkit-mask-image: linear-gradient(105deg, transparent 0%, #000 38%, #000 100%);
  }

  /* subtle waveform on the right — nods to the telemetry/power work */
  .wave { position: absolute; right: 0; top: 0; width: 640px; height: 396px; opacity: 0.30; }

  .content {
    position: absolute;
    left: 72px; top: 62px;
    width: 1200px;
  }

  .kicker {
    font-size: 15px; font-weight: 700;
    letter-spacing: 3.4px; text-transform: uppercase;
    color: #5eb8c4;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 40px; line-height: 1.17;
    font-weight: 700; letter-spacing: -0.6px;
    color: #ffffff;
  }
  h1 .accent { color: #7fc4d6; }

  /* Bottom-right: clear of the avatar (left) and of LinkedIn's edit
     pencil overlay (top-right). */
  .links {
    position: absolute;
    right: 72px; bottom: 104px;
    text-align: right;
    font-size: 17px; font-weight: 500;
    color: #9fb6c4; letter-spacing: 0.25px;
  }
  .links .sep { color: #4a6b7d; padding: 0 11px; }
  .links b { color: #cfe0ea; font-weight: 600; }

  /* stack chips, right-aligned under the links */
  .chips {
    position: absolute;
    right: 72px; bottom: 46px;
    display: flex; gap: 10px;
  }
  .chip {
    font-size: 14.5px; font-weight: 600; letter-spacing: 0.4px;
    color: #bdd6e3;
    border: 1px solid rgba(127,196,214,0.32);
    background: rgba(127,196,214,0.07);
    border-radius: 999px;
    padding: 7px 16px;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="grid"></div>

  <svg class="wave" viewBox="0 0 640 396" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 250 L70 250 L86 176 L104 312 L122 218 L140 250 L230 250 L246 198 L264 288 L282 250 L390 250 L408 160 L426 330 L444 232 L462 250 L640 250"
          fill="none" stroke="#7fc4d6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M0 316 L150 316 L166 286 L184 344 L202 316 L340 316 L358 292 L376 338 L394 316 L640 316"
          fill="none" stroke="#7fc4d6" stroke-width="1.5" stroke-linejoin="round" opacity="0.45"/>
  </svg>

  <div class="content">
    <div class="kicker">Full Stack Engineer &nbsp;&middot;&nbsp; Bengaluru</div>
    <h1>
      I build full-stack systems that ship on real hardware —<br>
      the <span class="accent">UI</span>, the <span class="accent">API</span>,
      and the <span class="accent">Linux</span> underneath.
    </h1>
  </div>

  <div class="links">
    <b>santhu.site</b><span class="sep">&middot;</span><b>habex.santhu.site</b><span class="sep">&middot;</span>github.com/Santhu32144
  </div>

  <div class="chips">
    <div class="chip">React</div>
    <div class="chip">TypeScript</div>
    <div class="chip">Node.js</div>
    <div class="chip">PostgreSQL</div>
    <div class="chip">Linux</div>
  </div>
</div>
</body>
</html>
